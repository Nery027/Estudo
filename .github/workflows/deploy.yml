# Publica o app no GitHub Pages a cada atualização da branch main.
# Antes de publicar, roda os testes: se algum falhar, o site NÃO é atualizado.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  # Permite rodar manualmente pela aba "Actions" do GitHub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se duas publicações começarem juntas, só a mais nova continua
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
